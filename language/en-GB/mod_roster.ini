MOD_ROSTER_IMPORT_TEXT_HELP="Put each section heading on its own line, then one name per line. Separate sections with a blank line. You may also write headings as **Heading**. A trailing *, **, †, ‡, or § marks a member. Put definitions such as *Principal at the end."
MOD_ROSTER_IMPORT_TEXT_EXAMPLE="Flutes\nAvery Chen\nMorgan Reed*\n\nOboe\nTaylor Quinn**\n\n*Principal\n**Operations Lead"
MOD_ROSTER_IMPORT_CSV_TITLE="CSV (.csv or pasted)"
MOD_ROSTER_IMPORT_CSV_HELP="The first row must be Name,Section,Flags. Use one row per name and section; repeat a name to assign another section. Flags may contain any text. Quote fields containing commas."
MOD_ROSTER_IMPORT_CSV_EXAMPLE="Name,Section,Flags\nAvery Chen,Flutes,\nMorgan Reed,Flutes,*\nTaylor Quinn,Oboe,**"
